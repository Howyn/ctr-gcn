# NTU60 X-Sub Joint, faster experiment preset for the measured RTX 3090 run.
# Batch size 128 differs from the original 64; validate accuracy separately.
# AMP/TF32 and cuDNN tuning change numerical behavior and determinism.
work_dir: ./work_dir/ntu60/xsub/ctrgcn_joint_fast128

feeder: feeders.feeder_ntu.Feeder
train_feeder_args:
  data_path: data/ntu/NTU60_CS.npz
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  normalization: False
  random_rot: True
  p_interval: [0.5, 1]
  vel: False
  bone: False

test_feeder_args:
  data_path: data/ntu/NTU60_CS.npz
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: False
  bone: False
  debug: False

model: model.ctrgcn.Model
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: spatial

weight_decay: 0.0004
base_lr: 0.1
lr_decay_rate: 0.1
step: [35, 55]
warm_up_epoch: 5

device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 65
nesterov: True
num_worker: 2
save_epoch: 0
amp: True
fast: True
cpu_threads: 1
benchmark_batches: 50
benchmark_warmup: 10
